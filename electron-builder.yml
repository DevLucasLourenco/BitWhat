appId: br.com.bitwhat.app
productName: BitWhat
copyright: Copyright © 2026 BitWhat

directories:
  output: dist

artifactName: '${productName}-${version}-Setup.${ext}'

publish:
  provider: github
  owner: DevLucasLourenco
  repo: BitWhat
  releaseType: release

files:
  - out/**
  - package.json

extraResources:
  - from: build
    to: build
    filter:
      - '**/*'

asar: true

# Ícone e versão no BitWhat.exe (ver scripts/after-pack.mjs).
afterPack: ./scripts/after-pack.mjs

win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: BitWhat
