<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none';"
    />
    <title>BitWhat</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      #bubble {
        position: absolute;
        inset: 8px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 25%, #4fd6b8, #0f766e 70%);
        color: #fff;
        cursor: grab;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        transition: transform 120ms ease;
        touch-action: none;
      }

      #bubble:hover {
        transform: scale(1.06);
      }

      #bubble.dragging {
        cursor: grabbing;
        transform: scale(1.1);
      }

      #bubble svg {
        width: 26px;
        height: 26px;
        pointer-events: none;
      }

      #badge {
        position: absolute;
        top: 4px;
        right: 2px;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        box-sizing: border-box;
        border-radius: 10px;
        background: #ef4444;
        color: #fff;
        font: 700 11px/20px 'Segoe UI', system-ui, sans-serif;
        text-align: center;
        box-shadow: 0 0 0 2px #0b1f1d;
        pointer-events: none;
      }

      #badge[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="bubble" role="button" aria-label="Abrir BitWhat" title="BitWhat — clique para abrir, arraste para mover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
      </svg>
    </div>
    <span id="badge" hidden></span>
    <script type="module" src="/src/bubble.ts"></script>
  </body>
</html>
